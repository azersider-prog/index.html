<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoostPro Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11616952' data-sdk='show_11616952'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --md-sys-color-surface: #1C1B1F; --md-sys-color-surface-container: #2B2930; --md-sys-color-primary: #D0BCFF; --md-sys-color-on-primary: #381E72; --md-sys-color-on-surface: #E6E1E5; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); margin: 0; padding: 16px; }
        .m3-card { background: var(--md-sys-color-surface-container); border-radius: 28px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { border: none; border-radius: 16px; padding: 14px 5px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 22px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .nav-btn:active { transform: scale(0.9); }
        
        .btn-tiktok { background: #000000; }
        .btn-youtube { background: #FF0000; }
        .btn-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df345b 45%, #d62976 60%, #962fbf 90%); }
        .btn-facebook { background: #1877F2; }
        .btn-twitter { background: #1DA1F2; }

        .m3-button { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: none; padding: 12px 24px; border-radius: 100px; font-weight: 600; width: 100%; cursor: pointer; }
        
        .wallet-main-btn { background: #49454F; color: white; border: none; border-radius: 16px; padding: 14px; font-weight: bold; width: 100%; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .wallet-options { display: none; margin-top: 12px; flex-direction: column; gap: 8px; }
        .wallet-sub-btn { background: #38353E; color: #E6E1E5; border: 1px solid #5d5964; border-radius: 12px; padding: 10px; font-weight: bold; cursor: pointer; text-align: right; }
        .address-box { margin-top: 6px; padding: 10px; background: #1c1b1f; border-radius: 10px; font-size: 11px; word-break: break-all; display: none; color: #38bdf8; border: 1px dashed #49454F; text-align: center; }
        .service-list-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #49454F; font-size: 14px; }
        .legal-notice { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="m3-card" style="text-align: center;">
        <div id="user-info" style="font-size: 14px; opacity: 0.8;">👤 جاري التحميل...</div>
        <h1 id="bal-display" style="font-size: 32px; margin: 10px 0; color: #38bdf8;">0</h1>
        <button class="m3-button" id="ad-btn"><i class="fa-solid fa-play"></i> مشاهدة إعلان لربح النقاط</button>
        <p id="msg" style="font-size: 12px; margin-top: 8px;"></p>
    </div>

    <!-- المنصات والخدمات -->
    <div class="nav-grid">
        <button class="nav-btn btn-tiktok" onclick="showServices('TikTok')"><i class="fa-brands fa-tiktok"></i></button>
        <button class="nav-btn btn-youtube" onclick="showServices('Youtube')"><i class="fa-brands fa-youtube"></i></button>
        <button class="nav-btn btn-instagram" onclick="showServices('Instagram')"><i class="fa-brands fa-instagram"></i></button>
        <button class="nav-btn btn-facebook" onclick="showServices('Facebook')"><i class="fa-brands fa-facebook"></i></button>
        <button class="nav-btn btn-twitter" onclick="showServices('Twitter')"><i class="fa-brands fa-twitter"></i></button>
    </div>

    <div class="m3-card">
        <h3 id="category-title" style="margin-top: 0; color: #38bdf8;"><i class="fa-solid fa-chart-line"></i> لوحة تحليل وإدارة النمو الرقمي</h3>
        <div id="services-list"><p style="text-align: center; opacity: 0.6; font-size: 13px;">اختر المنصة أعلاه لاستعراض الخدمات.</p></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // قراءة المعرف والرصيد من الرابط المرسل من البوت
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const balance = urlParams.get('balance');

        if (uid) {
            document.getElementById('user-info').innerHTML = `👤 المعرف: <b>${uid}</b>`;
        } else {
            document.getElementById('user-info').innerHTML = `👤 المستخدم غير معروف`;
        }

        if (balance !== null) {
            document.getElementById('bal-display').innerText = balance;
        }

        // دالة عرض الخدمات حسب المنصة
        function showServices(platform) {
            document.getElementById('category-title').innerHTML = `<i class="fa-solid fa-chart-line"></i> خدمات ${platform}`;
            const list = document.getElementById('services-list');
            list.innerHTML = `
                <div class="service-list-item"><span>زيادة متابعين ${platform}</span> <b>50 نقطة</b></div>
                <div class="service-list-item"><span>زيادة تفاعل / إعجابات</span> <b>30 نقطة</b></div>
            `;
        }

        // تشغيل إعلانات Monetag وإرسال المكافأة
        document.getElementById("ad-btn").onclick = () => {
            if (typeof show_11616952 === 'function') {
                document.getElementById("msg").innerText = "⏳ جاري عرض الإعلان...";
                show_11616952().then(() => {
                    document.getElementById("msg").innerText = "✅ تمت مشاهدة الإعلان! جاري الإضافة...";
                    if (uid) {
                        tg.sendData(JSON.stringify({ action: "add_ad_reward", uid: parseInt(uid) }));
                    } else {
                        document.getElementById("msg").innerText = "⚠️ خطأ: لم يتم التعرف على معرف المستخدم.";
                    }
                }).catch((e) => {
                    document.getElementById("msg").innerText = "⚠️ لم يكتمل الإعلان.";
                });
            } else {
                document.getElementById("msg").innerText = "⚠️ الإعلان غير جاهز حالياً.";
            }
        };
    </script>
</body>
</html>

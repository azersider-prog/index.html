<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoostPro App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --md-sys-color-surface: #1C1B1F; --md-sys-color-surface-container: #2B2930; --md-sys-color-primary: #D0BCFF; --md-sys-color-on-primary: #381E72; --md-sys-color-on-surface: #E6E1E5; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); margin: 0; padding: 16px; }
        .m3-card { background: var(--md-sys-color-surface-container); border-radius: 28px; padding: 20px; margin-bottom: 16px; }
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #49454F; border: none; border-radius: 16px; padding: 10px; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-btn:active { transform: scale(0.9); }
        .m3-button { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: none; padding: 12px 24px; border-radius: 100px; font-weight: 600; width: 100%; }
    </style>
</head>
<body>
    <div class="m3-card" style="text-align: center;">
        <div id="user-info">👤 جاري التحميل...</div>
        <h1 id="bal-display" style="font-size: 32px; margin: 10px 0;">0</h1>
        <button class="m3-button" id="ad-btn"><i class="fa-solid fa-play"></i> ربح نقاط مجانية</button>
    </div>

    <!-- الأزرار التفاعلية الحقيقية -->
    <div class="nav-grid">
        <button class="nav-btn" onclick="selectCategory('TikTok')"><i class="fa-brands fa-tiktok"></i></button>
        <button class="nav-btn" onclick="selectCategory('YouTube')"><i class="fa-brands fa-youtube"></i></button>
        <button class="nav-btn" onclick="selectCategory('Instagram')"><i class="fa-brands fa-instagram"></i></button>
        <button class="nav-btn" onclick="selectCategory('Facebook')"><i class="fa-brands fa-facebook"></i></button>
        <button class="nav-btn" onclick="selectCategory('Twitter')"><i class="fa-brands fa-twitter"></i></button>
    </div>

    <div class="m3-card" id="services-area">
        <h3 id="category-title">اختر منصة لعرض الخدمات</h3>
        <div id="services-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // وظيفة الأزرار الحقيقية
        function selectCategory(platform) {
            tg.HapticFeedback.impactOccurred('light');
            document.getElementById('category-title').innerText = `خدمات ${platform}`;
            document.getElementById('services-list').innerHTML = `<p>جاري تحميل خدمات ${platform}...</p>`;
            // هنا يمكنك إضافة منطق لجلب البيانات من قاعدة بياناتك بناءً على المنصة
        }

        const adController = window.Adsgram.init({ blockId: "43004" });
        document.getElementById("ad-btn").onclick = async () => {
            tg.HapticFeedback.notificationOccurred('success');
            try { await adController.show(); } catch(e) {}
        };
    </script>
</body>
</html>

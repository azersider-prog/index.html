
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>
    <button id="ad-btn" style="padding: 20px; font-size: 20px;">مشاهدة الإعلان</button>
    <p id="msg"></p>

    <script>
        const AdController = window.Adsgram.init({ blockId: "42932" });
        document.getElementById("ad-btn").addEventListener("click", () => {
            AdController.show().then((result) => {
                document.getElementById("msg").innerText = "تمت المشاهدة!";
            }).catch((err) => {
                document.getElementById("msg").innerText = "خطأ: " + err;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoostPro Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --md-sys-color-surface: #1C1B1F; --md-sys-color-surface-container: #2B2930; --md-sys-color-primary: #D0BCFF; --md-sys-color-on-primary: #381E72; --md-sys-color-on-surface: #E6E1E5; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); margin: 0; padding: 16px; }
        .m3-card { background: var(--md-sys-color-surface-container); border-radius: 28px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* شبكة المنصات */
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { border: none; border-radius: 16px; padding: 14px 5px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 22px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .nav-btn:active { transform: scale(0.9); }
        
        /* ألوان المنصات الرسمية */
        .btn-tiktok { background: #000000; color: #ffffff; border: 1px solid #333; }
        .btn-youtube { background: #FF0000; color: #ffffff; }
        .btn-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df345b 45%, #d62976 60%, #962fbf 90%); color: #ffffff; }
        .btn-facebook { background: #1877F2; color: #ffffff; }
        .btn-twitter { background: #1DA1F2; color: #ffffff; }

        .m3-button { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: none; padding: 12px 24px; border-radius: 100px; font-weight: 600; width: 100%; cursor: pointer; }
        
        /* أزرار المحفظة */
        .wallet-main-btn { background: #49454F; color: white; border: none; border-radius: 16px; padding: 14px; font-weight: bold; width: 100%; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 15px; transition: 0.2s; }
        .wallet-main-btn:active { transform: scale(0.98); }
        
        .wallet-options { display: none; margin-top: 12px; display: none; flex-direction: column; gap: 8px; }
        .wallet-sub-btn { background: #38353E; color: #E6E1E5; border: 1px solid #5d5964; border-radius: 12px; padding: 10px; font-weight: bold; cursor: pointer; text-align: right; transition: 0.2s; font-size: 14px; }
        .wallet-sub-btn:active { transform: scale(0.98); }

        .address-box { margin-top: 6px; padding: 10px; background: #1c1b1f; border-radius: 10px; font-size: 11px; word-break: break-all; display: none; color: #38bdf8; border: 1px dashed #49454F; text-align: center; }

        .service-list-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #49454F; font-size: 14px; }
        .service-list-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="m3-card" style="text-align: center;">
        <div id="user-info" style="font-size: 14px; opacity: 0.8;">👤 جاري التحميل...</div>
        <h1 id="bal-display" style="font-size: 32px; margin: 10px 0; color: #38bdf8;">0</h1>
        <button class="m3-button" id="ad-btn"><i class="fa-solid fa-play"></i> مشاهدة إعلان لربح النقاط</button>
        <p id="msg" style="font-size: 12px; margin-top: 8px;"></p>
    </div>

    <!-- شبكة المنصات بالألوان الرسمية -->
    <div class="nav-grid">
        <button class="nav-btn btn-tiktok" onclick="showServices('TikTok')"><i class="fa-brands fa-tiktok"></i></button>
        <button class="nav-btn btn-youtube" onclick="showServices('Youtube')"><i class="fa-brands fa-youtube"></i></button>
        <button class="nav-btn btn-instagram" onclick="showServices('Instagram')"><i class="fa-brands fa-instagram"></i></button>
        <button class="nav-btn btn-facebook" onclick="showServices('Facebook')"><i class="fa-brands fa-facebook"></i></button>
        <button class="nav-btn btn-twitter" onclick="showServices('Twitter')"><i class="fa-brands fa-twitter"></i></button>
    </div>

    <!-- قائمة الخدمات -->
    <div class="m3-card">
        <h3 id="category-title" style="margin-top: 0; color: #38bdf8;"><i class="fa-solid fa-cart-shopping"></i> اختر منصة لعرض الخدمات</h3>
        <div id="services-list">
            <p style="text-align: center; opacity: 0.6; font-size: 13px;">اضغط على أيقونة أي منصة بالأعلى لعرض الخدمات والأسعار المتاحة.</p>
        </div>
    </div>

    <!-- المحفظة التفاعلية المنسدلة -->
    <div class="m3-card">
        <button class="wallet-main-btn" onclick="toggleWalletMenu()">
            <span><i class="fa-solid fa-wallet" style="margin-left: 8px;"></i> المحفظة وعناوين الشحن</span>
            <i class="fa-solid fa-chevron-down" id="wallet-arrow"></i>
        </button>

        <div id="wallet-options" class="wallet-options">
            <button class="wallet-sub-btn" onclick="toggleAddress('bnb')">
                <i class="fa-solid fa-coins" style="color: #f3ba2f; margin-left: 6px;"></i> شحن عبر BNB (BEP20)
            </button>
            <div id="bnb-box" class="address-box" onclick="copyAddress('0x77a0abd8da44400bf11420409aa6b24f4809ff17')">
                <b>اضغط للنسخ:</b><br><code>0x77a0abd8da44400bf11420409aa6b24f4809ff17</code>
            </div>

            <button class="wallet-sub-btn" onclick="toggleAddress('ton')">
                <i class="fa-solid fa-gem" style="color: #0098ea; margin-left: 6px;"></i> شحن عبر TON
            </button>
            <div id="ton-box" class="address-box" onclick="copyAddress('UQCvg-_-aVBISkq8-EjJzsvEhmaq6MpUEThA39EE6eUklq27')">
                <b>اضغط للنسخ:</b><br><code>UQCvg-_-aVBISkq8-EjJzsvEhmaq6MpUEThA39EE6eUklq27</code>
            </div>
        </div>
        <p id="copy-msg" style="text-align: center; font-size: 11px; color: #38bdf8; margin-top: 8px;"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid') || '...';
        const balance = urlParams.get('balance') || '0';
        const servicesEncoded = urlParams.get('services');

        document.getElementById('user-info').innerHTML = `👤 المعرف: <b>${uid}</b>`;
        document.getElementById('bal-display').innerText = `${balance} نقطة`;

        let servicesData = [];
        try {
            if (servicesEncoded) {
                servicesData = JSON.parse(atob(servicesEncoded));
            }
        } catch (e) {
            console.error("خطأ في قراءة الخدمات:", e);
        }

        function showServices(platform) {
            tg.HapticFeedback.impactOccurred('light');
            document.getElementById('category-title').innerHTML = `<i class="fa-solid fa-cart-shopping"></i> خدمات ${platform}`;
            
            const filtered = servicesData.filter(s => s.category.toLowerCase() === platform.toLowerCase());
            
            if (filtered.length === 0) {
                document.getElementById('services-list').innerHTML = `<p style="text-align: center; color: #94a3b8;">لا توجد خدمات متاحة حالياً لهذه المنصة.</p>`;
                return;
            }

            const list = filtered.map(s => `
                <div class="service-list-item">
                    <span><b>${s.name}</b></span>
                    <span style="color: #38bdf8; font-weight: bold;">${s.rate} نقطة</span>
                </div>`).join('');
            
            document.getElementById('services-list').innerHTML = list;
        }

        // إظهار وإخفاء قائمة المحفظة الرئيسية
        function toggleWalletMenu() {
            tg.HapticFeedback.impactOccurred('medium');
            const menu = document.getElementById('wallet-options');
            const arrow = document.getElementById('wallet-arrow');
            if (menu.style.display === 'flex') {
                menu.style.display = 'none';
                arrow.className = 'fa-solid fa-chevron-down';
            } else {
                menu.style.display = 'flex';
                arrow.className = 'fa-solid fa-chevron-up';
            }
        }

        // إظهار وإخفاء عنوان العملة المحددة
        function toggleAddress(type) {
            tg.HapticFeedback.impactOccurred('light');
            const bnbBox = document.getElementById('bnb-box');
            const tonBox = document.getElementById('ton-box');
            
            if (type === 'bnb') {
                bnbBox.style.display = bnbBox.style.display === 'block' ? 'none' : 'block';
                tonBox.style.display = 'none';
            } else {
                tonBox.style.display = tonBox.style.display === 'block' ? 'none' : 'block';
                bnbBox.style.display = 'none';
            }
            document.getElementById('copy-msg').innerText = "";
        }

        // نسخ العنوان تلقائياً عند الضغط عليه
        function copyAddress(text) {
            navigator.clipboard.writeText(text);
            tg.HapticFeedback.notificationOccurred('success');
            document.getElementById('copy-msg').innerText = "✅ تم نسخ العنوان إلى الحافظة بنجاح!";
        }

        const adController = window.Adsgram.init({ blockId: "43004" });
        document.getElementById("ad-btn").onclick = async () => {
            tg.HapticFeedback.notificationOccurred('success');
            document.getElementById("msg").innerText = "⏳ جاري تحميل الإعلان...";
            try { 
                await adController.show(); 
                document.getElementById("msg").innerText = "✅ تمت مشاهدة الإعلان بنجاح!"; 
            } catch(e) { 
                document.getElementById("msg").innerText = "⚠️ تعذر عرض الإعلان حالياً."; 
            }
        };
    </script>
</body>
</html>

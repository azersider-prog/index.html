<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoostPro Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --md-sys-color-surface: #1C1B1F; --md-sys-color-surface-container: #2B2930; --md-sys-color-primary: #D0BCFF; --md-sys-color-on-primary: #381E72; --md-sys-color-on-surface: #E6E1E5; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); margin: 0; padding: 16px; }
        .m3-card { background: var(--md-sys-color-surface-container); border-radius: 28px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #49454F; border: none; border-radius: 16px; padding: 12px 5px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; transition: 0.2s; }
        .nav-btn:active { transform: scale(0.9); }
        .m3-button { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: none; padding: 12px 24px; border-radius: 100px; font-weight: 600; width: 100%; cursor: pointer; }
        .service-list-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #49454F; font-size: 14px; }
        .service-list-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="m3-card" style="text-align: center;">
        <div id="user-info" style="font-size: 14px; opacity: 0.8;">👤 جاري التحميل...</div>
        <h1 id="bal-display" style="font-size: 32px; margin: 10px 0; color: #38bdf8;">0</h1>
        <button class="m3-button" id="ad-btn"><i class="fa-solid fa-play"></i> مشاهدة إعلان لربح النقاط</button>
        <p id="msg" style="font-size: 12px; margin-top: 8px;"></p>
    </div>

    <!-- شبكة المنصات التفاعلية -->
    <div class="nav-grid">
        <button class="nav-btn" onclick="showServices('TikTok')"><i class="fa-brands fa-tiktok"></i></button>
        <button class="nav-btn" onclick="showServices('Youtube')"><i class="fa-brands fa-youtube"></i></button>
        <button class="nav-btn" onclick="showServices('Instagram')"><i class="fa-brands fa-instagram"></i></button>
        <button class="nav-btn" onclick="showServices('Facebook')"><i class="fa-brands fa-facebook"></i></button>
        <button class="nav-btn" onclick="showServices('Twitter')"><i class="fa-brands fa-twitter"></i></button>
    </div>

    <div class="m3-card">
        <h3 id="category-title" style="margin-top: 0; color: #38bdf8;"><i class="fa-solid fa-cart-shopping"></i> اختر منصة لعرض الخدمات</h3>
        <div id="services-list">
            <p style="text-align: center; opacity: 0.6; font-size: 13px;">اضغط على أيقونة أي منصة بالأعلى لعرض الخدمات والأسعار المتاحة.</p>
        </div>
    </div>

    <div class="m3-card">
        <h3 style="margin-top: 0; font-size: 15px;"><i class="fa-solid fa-wallet"></i> المحفظة وعناوين الشحن</h3>
        <p style="font-size: 11px; word-break: break-all;"><b>BNB:</b> <code>0x77a0abd8da44400bf11420409aa6b24f4809ff17</code></p>
        <p style="font-size: 11px; word-break: break-all;"><b>TON:</b> <code>UQCvg-_-aVBISkq8-EjJzsvEhmaq6MpUEThA39EE6eUklq27</code></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // استخراج البيانات المرسلة من البوت عبر الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid') || '...';
        const balance = urlParams.get('balance') || '0';
        const servicesEncoded = urlParams.get('services');

        document.getElementById('user-info').innerHTML = `👤 المعرف: <b>${uid}</b>`;
        document.getElementById('bal-display').innerText = `${balance} نقطة`;

        let servicesData = [];
        try {
            if (servicesEncoded) {
                servicesData = JSON.parse(atob(servicesEncoded));
            }
        } catch (e) {
            console.error("خطأ في قراءة الخدمات:", e);
        }

        // دالة عرض الخدمات الخاصة بكل منصة عند الضغط عليها
        function showServices(platform) {
            tg.HapticFeedback.impactOccurred('light');
            document.getElementById('category-titleinnerHTML` = `<i class="fa-solid fa-cart-shopping"></i> خدمات ${platform}`;
            
            const filtered = servicesData.filter(s => s.category.toLowerCase() === platform.toLowerCase());
            
            if (filtered.length === 0) {
                document.getElementById('services-list').innerHTML = `<p style="text-align: center; color: #94a3b8;">لا توجد خدمات متاحة حالياً لهذه المنصة.</p>`;
                return;
            }

            const list = filtered.map(s => `
                <div class="service-list-item">
                    <span><b>${s.name}</b></span>
                    <span style="color: #38bdf8; font-weight: bold;">${s.rate} نقطة</span>
                </div>`).join('');
            
            document.getElementById('services-list').innerHTML = list;
        }

        // تشغيل إعلانات Adsgram
        const adController = window.Adsgram.init({ blockId: "43004" });
        document.getElementById("ad-btn").onclick = async () => {
            tg.HapticFeedback.notificationOccurred('success');
            document.getElementById("msg").innerText = "⏳ جاري تحميل الإعلان...";
            try { 
                await adController.show(); 
                document.getElementById("msg").innerText = "✅ تمت مشاهدة الإعلان بنجاح!"; 
            } catch(e) { 
                document.getElementById("msg").innerText = "⚠️ تعذر عرض الإعلان حالياً."; 
            }
        };
    </script>
</body>
</html>

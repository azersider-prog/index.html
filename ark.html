<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ark AI Agent Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f12;
            --card-bg: #161a22;
            --gold-primary: #f0b90b;
            --gold-secondary: #d4af37;
            --text-main: #ffffff;
            --text-muted: #848e9c;
            --border-color: #2b313a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            color: var(--gold-primary);
            margin-bottom: 6px;
        }
        .header p {
            font-size: 13px;
            color: var(--text-muted);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
        }
        .token-symbol {
            font-size: 18px;
            font-weight: bold;
            color: var(--gold-primary);
            margin-bottom: 12px;
        }
        .address-box {
            background-color: #0b0f12;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-size: 11px;
            word-break: break-all;
            color: var(--text-muted);
            margin-bottom: 16px;
            direction: ltr;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .btn-primary:active {
            opacity: 0.8;
        }
        .msg {
            margin-top: 10px;
            font-size: 12px;
            color: var(--gold-primary);
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Ark AI Agent</h1>
            <p>منصة الذكاء الاصطناعي والويب 3 الرسمية</p>
        </div>

        <div class="card">
            <div class="token-symbol">$ARKAI Token</div>
            <div class="address-box" id="ca-text">0x982AD755380a1cFb9CEaF9f3c8E3153E6092BF3F</div>
            <button class="btn-primary" onclick="copyCA()">
                <i class="fa-solid fa-copy"></i> نسخ عقد العملة
            </button>
            <div class="msg" id="msg"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function copyCA() {
            const ca = "0x982AD755380a1cFb9CEaF9f3c8E3153E6092BF3F";
            navigator.clipboard.writeText(ca).then(() => {
                document.getElementById('msg').innerText = "تم نسخ عنوان العقد بنجاح!";
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }).catch(err => {
                document.getElementById('msg').innerText = "فشل النسخ، يرجى النسخ يدويًا.";
            });
        }
    </script>
</body>
</html>
